name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build zip package
        run: |
          mkdir -p dist
          zip -r dist/senior-java-backend-interview-playbook-${{ github.ref_name }}.zip . -x '*.git*' 'site/*' 'dist/*'
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
